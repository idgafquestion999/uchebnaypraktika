{% extends "base.html" %}
{% block title %}Товары{% endblock %}
{% block content %}
<h1>Управление товарами</h1>
<table class="table">
    <thead><tr><th>ID</th><th>Название</th><th>Цена</th><th>Склад</th><th></th></tr></thead>
    <tbody>
    {% for p in products %}
    <tr>
        <td>{{ p.id }}</td><td>{{ p.name }}</td><td>{{ "%.0f"|format(p.price) }} ₽</td><td>{{ p.stock }}</td>
        <td>
            <form method="POST" action="{{ url_for('admin_delete_product', product_id=p.id) }}">
                <button class="btn btn-danger btn-sm">Удалить</button>
            </form>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>

<h3>Добавить товар</h3>
<form method="POST" action="{{ url_for('admin_add_product') }}">
    <div class="row">
        <div class="col-md-6 mb-2"><input name="name" class="form-control" placeholder="Название" required></div>
        <div class="col-md-6 mb-2"><input name="brand" class="form-control" placeholder="Бренд"></div>
        <div class="col-md-4 mb-2">
            <select name="category_id" class="form-select" required>
                <option value="">Категория</option>
                {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-2"><input name="price" type="number" step="0.01" class="form-control" placeholder="Цена" required></div>
        <div class="col-md-4 mb-2"><input name="stock" type="number" class="form-control" placeholder="На складе"></div>
        <div class="col-12 mb-2"><textarea name="description" class="form-control" placeholder="Описание"></textarea></div>
        <div class="col-12"><button class="btn btn-dark">Добавить товар</button></div>
    </div>
</form>
{% endblock %}
